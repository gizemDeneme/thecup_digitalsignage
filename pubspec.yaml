name: thecup
description: "thecup Digital Signage - Admin & TV Display"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # Firebase
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.0
  cloud_firestore: ^5.4.0
  firebase_storage: ^12.3.0

  # State management
  flutter_riverpod: ^2.5.1

  # Video
  video_player: ^2.9.2
  chewie: ^1.8.5

  # Local cache (offline support)
  hive_flutter: ^1.1.0
  hive: ^2.2.3

  # File picking / upload
  file_picker: ^8.3.7
  image_picker: ^1.1.2

  # UI utilities
  cached_network_image: ^3.4.1
  flutter_reorderable_list: ^1.0.0

  # Utilities
  get_it: ^8.0.3
  uuid: ^4.4.2
  path_provider: ^2.1.4
  connectivity_plus: ^6.1.4
  intl: ^0.20.2
  http: ^1.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
